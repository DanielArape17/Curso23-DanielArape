<body>
  <script>
    /*
      Nivel experto:
      4. Crea una función recursiva que imprima la sucesión de Fibonacci hasta un número dado.
    */

    function fibonacciRecursivo (num, a, b, c) {
      if(num === 0){
        return 1
      }
      else if(num > 0){
        
        console.log("Num " + num)
        
        c = a + b
        a = b
        b = c
        c = a + b
        
        console.log("c2 = " + c)

        fibonacciRecursivo(num - 1, a, b, c)
      }
    }

    function resultadoFibonacciRecursivo(i){
      fibonacciRecursivo(i, 1, 1, 0)
    }

    let i = prompt("Ingrese las repeticiones de la succesion de Fibonacci")

    resultadoFibonacciRecursivo(i)

  </script>
</body>
