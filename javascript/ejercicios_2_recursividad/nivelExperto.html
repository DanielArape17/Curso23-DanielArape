  <script>
    /*
      Nivel experto:
      4. Crea una función recursiva que imprima la sucesión de Fibonacci hasta un número dado.
    */

    //let num = 8 o 5
    num = 8
    let a = 0
    let b = 1
    let i = 0

    function fibonacciRecursivo (num) {
      if(num === 1){
        return 1
      }
      else if(num > 0){
        console.log("Num " + num)
        console.log("Fibo " + ((num - 1) + (num - 2)))
        fibonacciRecursivo(num - 1)
      }
    }

    fibonacciRecursivo(5)
