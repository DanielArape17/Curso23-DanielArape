<body>
  <script>
    // 3. Crea una función que reciba un string y retorne el string al revés.

    let texto = "El profe Juan dejo tarea";

    function dereves(texto){

      let nuevoTexto = 0;

      for(let i = texto.length; i >= -1; i--){
        nuevoTexto +=  texto.charAt(i)
      }
      
      return nuevoTexto
    }

    console.log(dereves(texto))

  </script>
</body>
